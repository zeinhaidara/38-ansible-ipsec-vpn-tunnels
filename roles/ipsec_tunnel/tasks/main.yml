---
- name: Check required tunnel settings
  ansible.builtin.assert:
    that:
      - ipsec_tunnel_local_addr | default('') | length > 0
      - ipsec_tunnel_remote_addr | default('') | length > 0
      - ipsec_tunnel_local_id | default('') | length > 0
      - ipsec_tunnel_remote_id | default('') | length > 0
      - ipsec_tunnel_local_subnets | default([]) | length > 0
      - ipsec_tunnel_remote_subnets | default([]) | length > 0
      - ipsec_tunnel_name is match('^[a-z0-9-]+$')
      - ansible_facts.os_family in ipsec_tunnel_packages
    fail_msg: Tunnel settings are incomplete or the OS family is not supported.
    quiet: true

- name: Check the private key came from the vault
  ansible.builtin.assert:
    that:
      - ipsec_tunnel_private_key_pem is defined
      - "'PRIVATE KEY' in ipsec_tunnel_private_key_pem"
    fail_msg: ipsec_tunnel_private_key_pem must be set from Ansible Vault.
    quiet: true
  no_log: true

- name: Install strongSwan
  ansible.builtin.package:
    name: "{{ ipsec_tunnel_packages[ansible_facts.os_family] }}"
    state: present

- name: Allow forwarding between the tunnel subnets
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-ipsec-tunnel.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl settings

- name: Create swanctl directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/swanctl/conf.d, mode: "0750" }
    - { path: /etc/swanctl/x509, mode: "0755" }
    - { path: /etc/swanctl/x509ca, mode: "0755" }
    - { path: /etc/swanctl/private, mode: "0700" }

- name: Install CA certificate
  ansible.builtin.copy:
    src: "{{ ipsec_tunnel_ca_cert_src }}"
    dest: "/etc/swanctl/x509ca/{{ ipsec_tunnel_name }}-ca.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Reload swanctl config

- name: Install host certificate
  ansible.builtin.copy:
    src: "{{ ipsec_tunnel_cert_src }}"
    dest: "/etc/swanctl/x509/{{ ipsec_tunnel_name }}.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Reload swanctl config

- name: Install host private key
  ansible.builtin.copy:
    content: "{{ ipsec_tunnel_private_key_pem }}"
    dest: "/etc/swanctl/private/{{ ipsec_tunnel_name }}.key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Reload swanctl config

- name: Write swanctl connection
  ansible.builtin.template:
    src: swanctl.conf.j2
    dest: "/etc/swanctl/conf.d/{{ ipsec_tunnel_name }}.conf"
    owner: root
    group: root
    mode: "0640"
  notify: Reload swanctl config

- name: Enable and start strongSwan
  ansible.builtin.systemd_service:
    name: "{{ ipsec_tunnel_service }}"
    enabled: true
    state: started

- name: Set up the tunnel health check
  ansible.builtin.include_tasks: healthcheck.yml
